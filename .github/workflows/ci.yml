name: Payment Service CI

on:
  push:
    branches:
      - main

jobs:
  # ===== GIAI ĐOẠN 1: UNIT TEST =====
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Upload test report
        if: failure()            # chỉ upload khi test fail, để xem test nào lỗi
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 3

  # ===== GIAI ĐOẠN 2: BUILD JAR =====
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test                  # chỉ chạy khi job "test" thành công
    steps:
      # Job Isolation: runner mới, trống trơn -> phải checkout lại
      - name: Checkout code
        uses: actions/checkout@v7

      # Runner mới -> phải setup lại Java 21
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-jar
          path: build/libs/       # lưu cả thư mục chứa JAR
          retention-days: 3